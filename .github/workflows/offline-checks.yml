name: Offline checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install offline test dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Check shell syntax
        run: git ls-files -z -- 'scripts/*.sh' | xargs -0 -r -n 1 bash -n

      - name: Check Python syntax
        run: python -m compileall -q scripts tests

      - name: Test calibrated route and evidence audit
        run: python -m unittest discover -s tests -p test_calibrated_route.py -v
