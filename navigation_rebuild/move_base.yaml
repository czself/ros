controller_frequency: 10.0
controller_patience: 5.0
planner_frequency: 1.0
planner_patience: 5.0
recovery_behavior_enabled: false
clearing_rotation_allowed: false
# The traffic gate can hold the robot through the full 10 s red phase while a
# move_base goal remains active. Keep the action alive through that wait so it
# can resume on green instead of aborting at the stop line.
oscillation_timeout: 25.0
oscillation_distance: 0.08
base_global_planner: global_planner/GlobalPlanner
base_local_planner: dwa_local_planner/DWAPlannerROS
GlobalPlanner:
  allow_unknown: false
  default_tolerance: 0.0
  use_dijkstra: true
DWAPlannerROS:
  odom_topic: /odom
  max_vel_x: 0.25
  min_vel_x: 0.0
  max_vel_y: 0.0
  min_vel_y: 0.0
  max_vel_trans: 0.25
  min_vel_trans: 0.03
  max_vel_theta: 0.65
  min_vel_theta: 0.05
  acc_lim_x: 0.7
  acc_lim_y: 0.0
  acc_lim_theta: 1.5
  xy_goal_tolerance: 0.05
  yaw_goal_tolerance: 0.10
  latch_xy_goal_tolerance: true
  sim_time: 1.0
  vx_samples: 16
  vy_samples: 1
  vth_samples: 24
  path_distance_bias: 24.0
  goal_distance_bias: 20.0
  occdist_scale: 0.35
  forward_point_distance: 0.10
  stop_time_buffer: 0.25
  prune_plan: true
