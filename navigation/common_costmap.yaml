# Axle-ground origin, measured from the embedded 4.2 m world model.  The
# chassis is [-0.084, 0.084] m in its own x axis; the drive axle is at
# x=0.0525 m and wheel outside edges are y=+-0.0742 m. The polygon already
# includes a 1 cm safety margin and is expressed in base_footprint coordinates.
footprint: [[0.042, 0.085], [0.042, -0.085], [-0.147, -0.085], [-0.147, 0.085]]
footprint_padding: 0.0
transform_tolerance: 0.5
obstacle_layer:
  observation_sources: laser depth
  obstacle_range: 4.5
  raytrace_range: 5.0
  laser:
    data_type: LaserScan
    topic: /scan
    sensor_frame: lidar_link
    marking: true
    clearing: true
    inf_is_valid: true
    # The scanner reports +Inf for no return at its 3.36 m maximum.  With
    # inf_is_valid those rays are converted to 3.36 m points for clearing;
    # keep their endpoints outside marking range to avoid a phantom wall.
    obstacle_range: 3.30
    raytrace_range: 3.5
    observation_persistence: 0.0
  depth:
    data_type: PointCloud2
    topic: /camera/depth/points
    sensor_frame: camera_optical_frame
    marking: true
    clearing: true
    # Project only obstacles that can meet the chassis.  The traffic-light
    # crossbar starts around 0.375 m above ground; treating its overhead
    # depth points as floor obstacles seals the otherwise open lane.
    min_obstacle_height: 0.05
    max_obstacle_height: 0.28
    obstacle_range: 3.0
    raytrace_range: 3.5
    observation_persistence: 0.0
inflation_layer:
  # The global and local files override this independently.  A non-zero
  # common default is important when a caller loads only this file.
  inflation_radius: 0.30
  cost_scaling_factor: 5.0
