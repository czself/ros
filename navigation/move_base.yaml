controller_frequency: 10.0
controller_patience: 4.0
planner_frequency: 1.0
planner_patience: 8.0
recovery_behavior_enabled: true
clearing_rotation_allowed: true
recovery_behaviors:
  - {name: conservative_clear, type: "clear_costmap_recovery/ClearCostmapRecovery"}
  - {name: safe_escape, type: "safe_escape_recovery/SafeEscapeRecovery"}
conservative_clear:
  reset_distance: 0.5
safe_escape:
  max_distance: 0.32
  min_distance: 0.12
  safety_margin: 0.04
  speed: 0.10
oscillation_timeout: 8.0
oscillation_distance: 0.06
base_global_planner: navfn/NavfnROS
base_local_planner: dwa_local_planner/DWAPlannerROS
NavfnROS:
  allow_unknown: false
  default_tolerance: 0.0
DWAPlannerROS:
  odom_topic: /odom
  max_vel_x: 0.35
  # DWA checks reverse trajectories against the same complete footprint.
  min_vel_x: -0.08
  max_vel_y: 0.0
  min_vel_y: 0.0
  max_vel_trans: 0.35
  min_vel_trans: 0.025
  max_vel_theta: 0.8
  min_vel_theta: 0.05
  acc_lim_x: 0.80
  acc_lim_y: 0.50
  acc_lim_trans: 0.80
  acc_lim_theta: 2.0
  trans_stopped_vel: 0.02
  theta_stopped_vel: 0.05
  prune_plan: true
  # Ordinary navigation goals need a position, not a final heading.  The
  # mission executor performs its separate precise parking only after the
  # last return-to-birth segment.
  # Recorded photo points include a deliberate camera heading; accepting
  # any yaw makes the vehicle arrive at the right place while looking away.
  yaw_goal_tolerance: 0.10
  xy_goal_tolerance: 0.05
  latch_xy_goal_tolerance: true
  # A long DWA rollout can collide with a narrow turn before a valid short
  # steering command is considered.  The watchdog independently checks the
  # next 0.35 s of full-body motion against the paint map.
  sim_time: 1.2
  vx_samples: 35
  vy_samples: 1
  vth_samples: 45
  # Publishing every sampled trajectory cut Gazebo real-time factor during
  # full route runs; enable it only for a short, isolated diagnostic window.
  publish_traj_pc: false
  path_distance_bias: 18.0
  goal_distance_bias: 16.0
  occdist_scale: 0.25
  forward_point_distance: 0.10
  stop_time_buffer: 0.25
  oscillation_reset_dist: 0.10
  oscillation_reset_angle: 0.35
