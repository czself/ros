controller_frequency: 10.0
controller_patience: 10.0
planner_frequency: 1.0
planner_patience: 8.0
recovery_behavior_enabled: true
clearing_rotation_allowed: true
base_global_planner: navfn/NavfnROS
base_local_planner: dwa_local_planner/DWAPlannerROS
NavfnROS:
  allow_unknown: false
  default_tolerance: 0.10
DWAPlannerROS:
  odom_topic: /odom
  max_vel_x: 0.42
  # A slow reverse is the only escape from a corner pocket where the
  # footprint sweep exceeds the space to yaw in place.  DWA only samples
  # reverse arcs that are footprint-clean in the CURRENT local costmap
  # (obstacle layer, live laser clearing), so it backs away from walls
  # instead of into them; it never reverses blindly into unknown space.
  min_vel_x: -0.15
  max_vel_y: 0.0
  min_vel_y: 0.0
  max_vel_trans: 0.42
  min_vel_trans: 0.02
  max_vel_theta: 1.40
  min_vel_theta: 0.08
  acc_lim_x: 1.20
  acc_lim_y: 0.50
  acc_lim_trans: 0.80
  acc_lim_theta: 3.00
  trans_stopped_vel: 0.02
  theta_stopped_vel: 0.04
  prune_plan: true
  yaw_goal_tolerance: 0.45
  xy_goal_tolerance: 0.20
  latch_xy_goal_tolerance: true
  # Predict far enough to brake at the global safety boundary.  Path-follow
  # bias keeps the body on the inflated path instead of corner-cutting.
  sim_time: 1.5
  vx_samples: 30
  vy_samples: 1
  vth_samples: 40
  path_distance_bias: 10.0
  goal_distance_bias: 24.0
  occdist_scale: 0.05
  # Keeps walls at arm's length now that the local inflation radius is
  # deliberately small enough to leave real gates traversable.
  occdist_scale: 0.05
  forward_point_distance: 0.10
  stop_time_buffer: 0.35
  oscillation_reset_dist: 0.25
