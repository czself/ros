  # is world +y and visual-down is world -x.
  - id: TOP_LEFT
    action: visual_left
    from: [1.70, -1.60]
    to: [1.70, 1.70]
    heading: 1.5708
  - id: LEFT_DOWN
    action: visual_down
    from: [1.70, 1.70]
    to: [-0.20, 1.70]
    heading: 3.14159
  - id: MIDDLE_RIGHT
    action: visual_right
    from: [-0.20, 1.70]
    to: [-0.20, -0.45]
    heading: -1.5708
  - id: CENTER_DOWN
    action: visual_down
    from: [-0.20, -0.45]
    to: [-1.70, -0.45]
    heading: 3.14159
  - id: BOTTOM_RIGHT
    action: visual_right
    from: [-1.70, -0.45]
    to: [-1.70, -1.70]
    heading: -1.5708
  - id: RIGHT_UP_TO_FINISH
    action: visual_up
    from: [-1.70, -1.70]
    to: [1.70, -1.70]
