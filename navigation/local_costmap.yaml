local_costmap:
  global_frame: odom
  robot_base_frame: base_footprint
  track_unknown_space: true
  # Match the measured polygon loaded from common_costmap.yaml.  The default
  # 0.46 m circular radius closes this narrow 4.2 m arena to DWA.
  robot_radius: 0.0
  update_frequency: 8.0
  always_send_full_costmap: true
  publish_frequency: 4.0
  rolling_window: true
  # A goal across the 4.2 m arena must stay inside the rolling window even
  # when the robot starts in a corner.  At 5 m, DWA's goal-distance field was
  # unreachable (10001) for long goals although the global plan was valid.
  width: 8.5
  height: 8.5
  resolution: 0.05
  transform_tolerance: 0.5
  static_layer:
    # Keep the local DWA trajectories on the same white-line-safe map as the
    # global planner. The raw source map remains available for diagnostics.
    map_topic: /map
    subscribe_to_updates: true
  inflation_layer:
    # Keep real walls/objects in the local grid and enforce the full footprint.
    inflation_radius: 0.10
    cost_scaling_factor: 3.0
  plugins:
    - {name: static_layer, type: "costmap_2d::StaticLayer"}
    - {name: obstacle_layer, type: "costmap_2d::ObstacleLayer"}
    - {name: inflation_layer, type: "costmap_2d::InflationLayer"}
