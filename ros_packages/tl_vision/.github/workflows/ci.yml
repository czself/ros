name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  lint-and-test:
    name: 静态检查 + 单元测试
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'   # 与 ROS Noetic 保持一致

      - name: 安装轻量依赖（不含 torch/ultralytics）
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml numpy opencv-python-headless

      - name: ruff 静态检查
        run: |
          pip install ruff
          ruff check src/ test/

      - name: 单元测试
        # 覆盖的配置与消息解析不需要 torch/ultralytics, 也不需要模型权重
        run: python -m unittest discover -s test -p 'test_*.py' -v

      - name: package.xml 合法性
        run: |
          pip install catkin_pkg
          python -c "from catkin_pkg.package import parse_package; \
                     p=parse_package('package.xml'); \
                     print('package ok:', p.name, p.version)"

      - name: msg 文件都已登记进 CMakeLists
        # 漏登记的话 catkin_make 不会生成消息, 队友那边表现为
        # ImportError: cannot import name 'tl_vision.msg' —— 报错信息完全不
        # 指向真正的原因, 很难查。写测试兜住。
        run: |
          python - <<'PY'
          import pathlib, re, sys
          cmake = pathlib.Path('CMakeLists.txt').read_text(encoding='utf-8')
          listed = set(re.findall(r'([A-Za-z_]\w*\.msg)', cmake))
          on_disk = {p.name for p in pathlib.Path('msg').glob('*.msg')}
          missing = on_disk - listed
          ghost = listed - on_disk
          if missing or ghost:
              if missing:
                  print('::error::这些 msg 没写进 CMakeLists: %s' % sorted(missing))
              if ghost:
                  print('::error::CMakeLists 引用了不存在的 msg: %s' % sorted(ghost))
              sys.exit(1)
          print('msg ok:', sorted(on_disk))
          PY

      - name: rosrun 入口脚本都已登记
        run: |
          python - <<'PY'
          import pathlib, re, sys
          cmake = pathlib.Path('CMakeLists.txt').read_text(encoding='utf-8')
          listed = set(re.findall(r'scripts/([A-Za-z_]\w*)', cmake))
          on_disk = {p.name for p in pathlib.Path('scripts').iterdir() if p.is_file()}
          if on_disk - listed:
              print('::error::这些脚本没写进 catkin_install_python: %s'
                    % sorted(on_disk - listed))
              sys.exit(1)
          print('scripts ok:', sorted(on_disk))
          PY

  no-torch-leak:
    name: OCR 侧不得依赖 torch
    runs-on: ubuntu-22.04
    # paddleocr 与 torch 常常装不进同一个环境, 所以 ocr_node 必须能在只有
    # paddleocr 的环境里起来。见 README §4.1。
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - name: 安装 paddleocr 侧的依赖（故意不装 torch/ultralytics）
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml numpy opencv-python-headless
      - name: 导入 OCR 模块不得拉起 torch
        run: |
          PYTHONPATH=src python - <<'PY'
          import sys
          import tl_vision.config, tl_vision.ocr, tl_vision.plate_text, tl_vision.visualize
          leaked = sorted(m for m in sys.modules
                          if m.split('.')[0] in ('torch', 'ultralytics', 'paddle', 'paddleocr'))
          if leaked:
              print('::error::OCR 侧泄漏了重型依赖: %s' % leaked)
              raise SystemExit(1)
          print('no torch/ultralytics/paddle leaked')
          PY
      - name: 单元测试在无 torch 环境下必须全绿
        run: python -m unittest discover -s test -p 'test_*.py'

  yaml-and-msg:
    name: 配置与消息文件自检
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - name: 校验 yaml 可解析且不含 BOM 问题
        run: |
          pip install pyyaml
          python -c "
          import yaml, pathlib
          for p in pathlib.Path('config').glob('*.yaml'):
              yaml.safe_load(p.read_text(encoding='utf-8-sig'))
              print('ok', p)
          "
      - name: 确认权重与数据集没被误提交
        run: |
          if git ls-files | grep -Ei '\.(pt|pth|onnx|zip)$'; then
            echo "::error::检测到被跟踪的权重/压缩包, 请检查 .gitignore"
            exit 1
          fi
          echo "no weights tracked"
